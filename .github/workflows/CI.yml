name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  interop:
    name: Interop (libnghttp2 cross-tests)
    runs-on: ubuntu-latest
    # Nghttp2Wrapper.jl requires Julia 1.12+, so this job runs on the
    # current stable release only and is NOT matrixed across the
    # main test-job's [1.10, 1] range.
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate interop env
        # HTTP2 + Nghttp2Wrapper are resolved via the [sources] block in
        # test/interop/Project.toml (Julia ≥ 1.11), so a plain
        # Pkg.instantiate() is sufficient.
        run: julia --project=test/interop -e 'using Pkg; Pkg.instantiate()'
      - name: Run interop cross-tests
        run: julia --project=test/interop test/interop/runtests.jl

  # Run the test suite of a package that depends on this one, against the code in
  # this branch rather than the released version.
  #
  # Rationale: a flow-control defect here (process_data_frame! never consuming the
  # receive window, so no WINDOW_UPDATE was ever emitted) surfaced downstream as
  # "gRPC requests over ~64KB fail" and took a long investigation to trace back.
  # A defect in a protocol library is far cheaper to diagnose from the consumer's
  # failing test than from the consumer's symptom.
  #
  # Non-blocking on purpose: a downstream failure can equally mean the consumer is
  # broken. Treat a red run as a signal to look, not as a gate on this repository.
  downstream:
    name: "Downstream: gRPCServer.jl"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: PureHTTP2.jl
      - uses: actions/checkout@v7
        with:
          repository: s-celles/gRPCServer.jl
          # develop, not the default branch: that is where gRPCServer's current
          # work lands, so it is what this job needs to exercise.
          ref: develop
          path: gRPCServer.jl
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install grpcurl
        run: |
          GRPCURL_VERSION="1.8.9"
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin grpcurl
      # Relax the consumer's compat bound on this package before developing it.
      # A downstream job tests unreleased code by definition, so the bound will
      # not admit it — the first run of this job died on
      # "empty intersection between PureHTTP2@0.6.0 and project compatibility 0.5".
      # That is a real signal for the consumer, but not what this job checks: it
      # exercises the code, not the bound.
      #
      # Edited through Julia's TOML stdlib rather than a regex. A regex over
      # Project.toml matched the [deps] entry too, where the value is a UUID, and
      # rewrote it to "0" — the run then died on `Malformed UUID string: "0"`.
      # A parser addresses [compat] unambiguously.
      - name: Relax the PureHTTP2 compat bound in the consumer
        run: |
          julia -e '
            using TOML
            path = "gRPCServer.jl/Project.toml"
            project = TOML.parsefile(path)
            compat = get(project, "compat", nothing)
            if compat !== nothing && haskey(compat, "PureHTTP2")
                @info "relaxing compat" was=compat["PureHTTP2"]
                compat["PureHTTP2"] = "0"
                open(io -> TOML.print(io, project), path, "w")
            else
                @warn "no PureHTTP2 compat entry found; leaving Project.toml alone"
            end'
      - name: Test gRPCServer.jl against this PureHTTP2
        run: |
          julia --project=gRPCServer.jl -e '
            using Pkg
            Pkg.develop(PackageSpec(path="PureHTTP2.jl"))
            Pkg.instantiate()
            Pkg.test()'
