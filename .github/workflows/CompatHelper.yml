# Opens pull requests raising [compat] bounds as dependencies release new
# versions.
#
# This package has no runtime dependencies, which is why it was initially left
# out — that was too quick a read. It still declares compat for TestItemRunner
# in the main project, and test/interop/ is a full environment of its own with
# Nghttp2Wrapper, OpenSSL, Reseau, JSON and TestItemRunner. Reseau in particular
# moves fast: the interop environment sat on 1.0.1 while 1.3.4 was out.
#
# `subdirs` is what makes the interop environment visible; without it only the
# top-level Project.toml is considered.
name: CompatHelper

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install CompatHelper
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
        run: julia -e 'using CompatHelper; CompatHelper.main(; subdirs = ["", "test/interop"])'
